<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ModStudio</title>
    <script>
      // Apparence choisie (réglages), posée avant le premier affichage.
      // Même logique que apply() dans src/lib/appearance.svelte.ts.
      try {
        var a = JSON.parse(localStorage.getItem("modstudio.appearance") || "null");
        // Fond de l'appli dès le premier affichage, avant ses styles (même
        // calcul que --ink dans app.css). Par le script et pas une balise
        // <style> : Tauri lui ajouterait un nonce qui annulerait 'unsafe-inline'.
        var light = a && a.theme === "light" ? true : a && a.theme === "dark" ? false : matchMedia("(prefers-color-scheme: light)").matches;
        var accent = a && /^#[0-9a-f]{6}$/i.test(a.colorA) ? a.colorA : "#c39bff";
        var tint = a && a.tint === false ? 0 : 0.22;
        document.documentElement.style.background = light
          ? "oklch(from " + accent + " 0.955 calc(c * " + tint * 0.5 + ") h)"
          : "oklch(from " + accent + " 0.215 calc(c * " + tint + ") h)";
        if (a) {
          var r = document.documentElement;
          if (a.theme === "dark" || a.theme === "light") r.dataset.theme = a.theme;
          if (a.tint === false) r.dataset.tint = "off";
          if (a.text === "small" || a.text === "large") r.dataset.text = a.text;
          if (a.thumbs === "small" || a.thumbs === "large") r.dataset.thumbs = a.thumbs;
          if (a.corners === "square" || a.corners === "round") r.dataset.corners = a.corners;
          if (/^#[0-9a-f]{6}$/i.test(a.colorA)) r.style.setProperty("--accent-a", a.colorA);
          if (/^#[0-9a-f]{6}$/i.test(a.colorB)) r.style.setProperty("--accent-b", a.colorB);
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="off">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
