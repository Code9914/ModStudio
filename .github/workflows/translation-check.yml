# Traduction des descriptions : les modèles épinglés se téléchargent toujours
# (empreintes SHA-256) et le moteur Bergamot les charge et traduit, dans un
# vrai navigateur. Lancé quand la liste des modèles ou le moteur changent.
name: Traduction locale

on:
  push:
    branches: [dev]
    paths:
      - "src-tauri/translation-models.json"
      - "scripts/translation-check.mjs"
      - "package.json"
      - ".github/workflows/translation-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # Le navigateur est le Google Chrome déjà installé sur la machine de
      # GitHub : le téléchargement de Chromium par Playwright pouvait rester
      # bloqué indéfiniment.
      - name: Installer les dépendances
        timeout-minutes: 10
        run: |
          npm ci
          npm i --no-save playwright@1.50.1

      - name: Télécharger les modèles et traduire
        timeout-minutes: 15
        env:
          PW_CHANNEL: chrome
        run: |
          google-chrome --version
          node scripts/translation-check.mjs en-fr fr-en zh-Hans-en
