# Compile ModStudio sous Windows sur les machines de GitHub et publie les
# installateurs (.exe et .msi) dans une release du dépôt.
name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier l'interface
        run: npm run check

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compiler et publier les installateurs
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des mises à jour (clé privée rangée dans les secrets du dépôt).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ModStudio v__VERSION__"
          releaseBody: |
            Installateurs Windows de ModStudio.
            - `ModStudio_x.y.z_x64-setup.exe` : installateur classique (recommandé)
            - `ModStudio_x.y.z_x64_en-US.msi` : paquet MSI
          releaseDraft: false
          # Release normale : ModStudio cherche ses mises à jour dans la dernière release.
          prerelease: false
          # latest.json : fichier lu par ModStudio pour se mettre à jour (installateur NSIS).
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Garder une copie des installateurs
        uses: actions/upload-artifact@v4
        with:
          name: modstudio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
