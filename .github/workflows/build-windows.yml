# Compile ModStudio sous Windows puis sous Linux sur les machines de GitHub et
# publie les installateurs (.exe, .msi, .AppImage, .deb) dans une release du dépôt.
name: Build

on:
  push:
    branches: [main]
    # Une modification de la documentation seule ne republie pas de version.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier l'interface
        run: npm run check

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compiler et publier les installateurs
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des mises à jour (clé privée rangée dans les secrets du dépôt).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ModStudio v__VERSION__"
          releaseBody: |
            Windows :
            - `ModStudio_x.y.z_x64-setup.exe` : installateur classique (recommandé)
            - `ModStudio_x.y.z_x64_en-US.msi` : paquet MSI

            Linux (ajoutés quelques minutes après) :
            - `ModStudio_x.y.z_amd64.AppImage` : appli à lancer telle quelle, qui se met à jour toute seule (recommandé)
            - `ModStudio_x.y.z_amd64.deb` : paquet Debian / Ubuntu
          releaseDraft: false
          # Release normale : ModStudio cherche ses mises à jour dans la dernière release.
          prerelease: false
          # latest.json : fichier lu par ModStudio pour se mettre à jour (installateur NSIS).
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Garder une copie des installateurs
        uses: actions/upload-artifact@v4
        with:
          name: modstudio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Après Windows : la release existe déjà, les fichiers Linux s'y ajoutent et
  # latest.json reçoit la plateforme Linux (AppImage).
  linux:
    needs: windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compiler et publier les paquets Linux
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "ModStudio v__VERSION__"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles appimage,deb

      - name: Garder une copie des paquets
        uses: actions/upload-artifact@v4
        with:
          name: modstudio-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # Paquet AUR (CachyOS, Arch Linux) : le PKGBUILD reprend le .deb de la
  # release. Construit par makepkg dans un conteneur Arch, puis publié sur
  # l'AUR quand la clé SSH du compte AUR est dans les secrets du dépôt
  # (AUR_SSH_PRIVATE_KEY) ; sans elle, le PKGBUILD reste dans les artefacts.
  aur:
    needs: linux
    runs-on: ubuntu-latest
    env:
      HAS_AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le paquet AUR actuel
        if: env.HAS_AUR_KEY == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Clé du serveur de l'AUR, vérifiée avec l'empreinte publiée par Arch Linux.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$HOME/.ssh/aur_host" 2>/dev/null
          ssh-keygen -lf "$HOME/.ssh/aur_host" | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' \
            || { echo "Clé du serveur de l'AUR inattendue : publication annulée."; exit 1; }
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/aur_host" >> "$GITHUB_ENV"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/aur_host" \
            git clone ssh://aur@aur.archlinux.org/modstudio-bin.git "$RUNNER_TEMP/aur"

      - name: Mettre le PKGBUILD à la nouvelle version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          deb="ModStudio_${version}_amd64.deb"
          gh release download "v$version" --pattern "$deb" --dir "$RUNNER_TEMP"
          sum=$(sha256sum "$RUNNER_TEMP/$deb" | cut -d' ' -f1)
          rel=1
          # Même version déjà publiée : .deb identique, rien ne change ; .deb
          # refait (nouvelle compilation), la révision augmente.
          current="$RUNNER_TEMP/aur/PKGBUILD"
          if [ -f "$current" ] && [ "$(sed -n 's/^pkgver=//p' "$current")" = "$version" ]; then
            rel=$(sed -n 's/^pkgrel=//p' "$current")
            grep -q "$sum" "$current" || rel=$((rel + 1))
          fi
          packaging/aur/update.sh "$version" "$sum" "$rel"

      - name: Construire le paquet avec makepkg (Arch Linux)
        run: |
          docker run --rm -v "$PWD/packaging/aur:/aur" archlinux:base-devel bash -euo pipefail -c '
            useradd -m builder
            cp -r /aur /home/builder/pkg
            chown -R builder /home/builder/pkg
            cd /home/builder/pkg
            su builder -c "makepkg --nodeps --noconfirm --cleanbuild"
            su builder -c "makepkg --printsrcinfo" > /aur/.SRCINFO
            bsdtar -tf modstudio-bin-*.pkg.tar.* | grep -E "usr/bin/modstudio$|usr/share/modstudio/package-manager$"
          '

      - name: Publier sur l'AUR
        if: env.HAS_AUR_KEY == 'true'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO "$RUNNER_TEMP/aur/"
          cd "$RUNNER_TEMP/aur"
          git config user.name "Code9914"
          git config user.email "Code9914@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "Le paquet AUR est déjà à jour."
          else
            git commit -m "v$version-$(sed -n 's/^pkgrel=//p' PKGBUILD)"
            git push origin HEAD:master
          fi

      - name: Garder le PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: modstudio-aur
          path: |
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
