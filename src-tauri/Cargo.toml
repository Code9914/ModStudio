[package]
name = "modstudio"
version = "0.12.0"
description = "Client de bureau non officiel pour mod.io et Nexus Mods"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "modstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` : vue web intégrée dans la fenêtre principale (page Nexus).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query", "form"] }
tokio = { version = "1.54.1", features = ["time", "rt", "sync"] }
keyring = "4.2.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz", "zstd"] }
md-5 = "0.11.0"
sha2 = "0.11.1"
semver = "1.0.28"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
tauri-plugin-dialog = "2.8.4"
roxmltree = "0.20"
base64 = "0.22"
flate2 = "1.1"
yaml-rust2 = "0.10"
whatlang = "0.16.4"
unrar = "0.5.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
# Les tests fabriquent des archives 7z.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
